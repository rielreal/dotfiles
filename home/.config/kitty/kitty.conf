font_family CaskaydiaCove Nerd Font Mono
font_size 10.0
modify_font cell_height 110%
enable_audio_bell no
remember_window_size no
background_opacity 0.68
dynamic_background_opacity yes
confirm_os_window_close 0

window_padding_width 12 16
hide_window_decorations yes
cursor_shape beam
cursor_trail 1
cursor_blink_interval 0

tab_bar_edge bottom
tab_bar_style separator
tab_separator "  "
tab_bar_margin_width 8
tab_title_template " {index} {title[:30]} "
active_tab_font_style bold
inactive_tab_font_style normal

map ctrl+shift+a launch --stdin-source=@screen_scrollback --type=background wl-copy

include theme.conf
include ~/.local/state/rice/kitty-colors.conf
include local.conf
