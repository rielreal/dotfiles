source = ~/.local/state/rice/hyprlock-colors.conf
$font = Rubik

general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/.local/state/wallpaper
    color = rgb(191724)
    blur_size = 8
    blur_passes = 3
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.3
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +%H) </big></b>"
    color = $lockHours
    font_size = 180
    font_family = $font SemiBold
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +%M) </big></b>"
    color = $lockMinutes
    font_size = 180
    font_family = $font SemiBold
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date '+%d %b') </big></b>"
    color = $lockText
    font_size = 20
    font_family = $font SemiBold
    position = 0, -260
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<b><big> $(date +%A) </big></b>"
    color = $lockText
    font_size = 20
    font_family = $font SemiBold
    position = 0, -290
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 3
    dots_size = 0.2
    dots_spacing = 1.0
    dots_center = true
    outer_color = $lockFieldOuter
    inner_color = $lockFieldInner
    font_color = $lockText
    check_color = $lockCheck
    fail_color = $lockFail
    fade_on_empty = true
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, 60
    halign = center
    valign = bottom
}

label {
    monitor =
    text = $LAYOUT
    color = $lockMuted
    font_size = 20
    font_family = $font
    position = -2%, 1%
    halign = right
    valign = bottom
}
