$mod = SUPER
$scripts = ~/.config/hypr/scripts
$terminal = uwsm app -- kitty
$files = uwsm app -- nautilus --new-window
$editor = uwsm app -- code
$browser = uwsm app -- "$(xdg-settings get default-web-browser)"
$menu = pkill -x rofi || rofi

bindd = $mod, Q, close window, exec, $scripts/close-window
bindd = ALT, F4, close window, exec, $scripts/close-window
bindd = $mod, L, lock screen, exec, loginctl lock-session
bindd = $mod, W, toggle floating, togglefloating
bindd = $mod, G, toggle group, togglegroup
bindd = SHIFT, F11, toggle fullscreen, fullscreen
bindd = $mod, J, toggle split, layoutmsg, togglesplit
bindd = $mod CTRL, H, previous window in group, changegroupactive, b
bindd = $mod CTRL, L, next window in group, changegroupactive, f

bindd = $mod, Left, focus left, movefocus, l
bindd = $mod, Right, focus right, movefocus, r
bindd = $mod, Up, focus up, movefocus, u
bindd = $mod, Down, focus down, movefocus, d
bindd = ALT, Tab, cycle focus, cyclenext

binded = $mod SHIFT, Right, resize right, resizeactive, 30 0
binded = $mod SHIFT, Left, resize left, resizeactive, -30 0
binded = $mod SHIFT, Up, resize up, resizeactive, 0 -30
binded = $mod SHIFT, Down, resize down, resizeactive, 0 30

bindd = $mod SHIFT CTRL, Left, move window left, movewindow, l
bindd = $mod SHIFT CTRL, Right, move window right, movewindow, r
bindd = $mod SHIFT CTRL, Up, move window up, movewindow, u
bindd = $mod SHIFT CTRL, Down, move window down, movewindow, d

binddm = $mod, mouse:272, drag to move window, movewindow
binddm = $mod, mouse:273, drag to resize window, resizewindow
binddm = $mod, Z, hold to move window, movewindow
binddm = $mod, X, hold to resize window, resizewindow

bindd = $mod, T, terminal, exec, $terminal
bindd = $mod ALT, T, dropdown terminal, togglespecialworkspace, term
bindd = $mod, E, file manager, exec, $files
bindd = $mod, C, text editor, exec, $editor
bindd = $mod, B, web browser, exec, $browser
bindd = CTRL SHIFT, Escape, system monitor, exec, uwsm app -- kitty --class btop -o background_opacity=1 -o font_size=11 -e btop
bindd = $mod, Escape, power menu, exec, pkill -x rofi || $scripts/powermenu

bindd = $mod, A, app launcher, exec, $menu -show drun
bindd = $mod, TAB, window switcher, exec, $menu -show window
bindd = $mod SHIFT, E, file finder, exec, $menu -show filebrowser
bindd = $mod, slash, keybind list, exec, pkill -x rofi || $scripts/keybinds
bindd = $mod, V, clipboard history, exec, pkill -x rofi || $scripts/clipboard paste
bindd = $mod SHIFT, V, manage clipboard, exec, pkill -x rofi || $scripts/clipboard manage
bindd = $mod SHIFT, W, pick wallpaper, exec, pkill -x rofi || $scripts/wallpaper
bindd = $mod, N, last notification, exec, dunstctl history-pop
bindd = $mod SHIFT, C, pick a colour, exec, hyprpicker -a -f hex

bindd = $mod, P, screenshot region, exec, $scripts/screenshot region
bindd = $mod CTRL, P, screenshot region (frozen), exec, $scripts/screenshot frozen
binddl = $mod ALT, P, screenshot monitor, exec, $scripts/screenshot monitor
bindd = $mod SHIFT, P, edit last screenshot, exec, $scripts/screenshot edit-last

binddl = , XF86AudioMute, mute, exec, swayosd-client --output-volume mute-toggle
binddel = , XF86AudioLowerVolume, volume down, exec, swayosd-client --output-volume lower --max-volume 100
binddel = , XF86AudioRaiseVolume, volume up, exec, swayosd-client --output-volume raise --max-volume 100
binddl = , XF86AudioPlay, play/pause, exec, playerctl play-pause
binddl = , XF86AudioPause, play/pause, exec, playerctl play-pause
binddl = , XF86AudioNext, next track, exec, playerctl next
binddl = , XF86AudioPrev, previous track, exec, playerctl previous

binddl = $mod, K, switch keyboard layout, exec, hyprctl switchxkblayout all next


bindd = $mod, S, toggle scratchpad, togglespecialworkspace
bindd = $mod SHIFT, S, move to scratchpad, movetoworkspace, special
bindd = $mod ALT, S, move to scratchpad (silent), movetoworkspacesilent, special

bindd = $mod, 1, workspace 1, workspace, 1
bindd = $mod, 2, workspace 2, workspace, 2
bindd = $mod, 3, workspace 3, workspace, 3
bindd = $mod, 4, workspace 4, workspace, 4
bindd = $mod, 5, workspace 5, workspace, 5
bindd = $mod, 6, workspace 6, workspace, 6
bindd = $mod, 7, workspace 7, workspace, 7
bindd = $mod, 8, workspace 8, workspace, 8
bindd = $mod, 9, workspace 9, workspace, 9
bindd = $mod, 0, workspace 10, workspace, 10

bindd = $mod SHIFT, 1, move to workspace 1, movetoworkspace, 1
bindd = $mod SHIFT, 2, move to workspace 2, movetoworkspace, 2
bindd = $mod SHIFT, 3, move to workspace 3, movetoworkspace, 3
bindd = $mod SHIFT, 4, move to workspace 4, movetoworkspace, 4
bindd = $mod SHIFT, 5, move to workspace 5, movetoworkspace, 5
bindd = $mod SHIFT, 6, move to workspace 6, movetoworkspace, 6
bindd = $mod SHIFT, 7, move to workspace 7, movetoworkspace, 7
bindd = $mod SHIFT, 8, move to workspace 8, movetoworkspace, 8
bindd = $mod SHIFT, 9, move to workspace 9, movetoworkspace, 9
bindd = $mod SHIFT, 0, move to workspace 10, movetoworkspace, 10

bindd = $mod ALT, 1, move to workspace 1 (silent), movetoworkspacesilent, 1
bindd = $mod ALT, 2, move to workspace 2 (silent), movetoworkspacesilent, 2
bindd = $mod ALT, 3, move to workspace 3 (silent), movetoworkspacesilent, 3
bindd = $mod ALT, 4, move to workspace 4 (silent), movetoworkspacesilent, 4
bindd = $mod ALT, 5, move to workspace 5 (silent), movetoworkspacesilent, 5
bindd = $mod ALT, 6, move to workspace 6 (silent), movetoworkspacesilent, 6
bindd = $mod ALT, 7, move to workspace 7 (silent), movetoworkspacesilent, 7
bindd = $mod ALT, 8, move to workspace 8 (silent), movetoworkspacesilent, 8
bindd = $mod ALT, 9, move to workspace 9 (silent), movetoworkspacesilent, 9
bindd = $mod ALT, 0, move to workspace 10 (silent), movetoworkspacesilent, 10
