exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP HYPRLAND_INSTANCE_SIGNATURE QT_QPA_PLATFORMTHEME XCURSOR_THEME XCURSOR_SIZE
exec-once = hyprctl setcursor Bibata-Modern-Ice 24

exec-once = uwsm app -- /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = uwsm app -- waybar
exec-once = uwsm app -- hypridle
exec-once = uwsm app -- swayosd-server
exec-once = uwsm app -- awww-daemon --format xrgb
exec-once = uwsm app -- udiskie --no-automount --smart-tray
exec-once = uwsm app -- nautilus --gapplication-service

exec-once = cliphist wipe
exec-once = uwsm app -- wl-paste --type text --watch cliphist store
exec-once = uwsm app -- wl-paste --type image --watch cliphist store
exec-once = uwsm app -- wl-clip-persist --clipboard regular

exec-once = gnome-keyring-daemon --start --components=pkcs11,secrets,ssh --control-directory=$XDG_RUNTIME_DIR/keyring
