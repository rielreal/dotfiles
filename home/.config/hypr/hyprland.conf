source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/binds.conf
source = ~/.config/hypr/rules.conf

env = SSH_AUTH_SOCK,$XDG_RUNTIME_DIR/gcr/ssh

input {
    kb_layout = us
    accel_profile = flat
    numlock_by_default = true
}

cursor {
    no_hardware_cursors = true
    hide_on_key_press = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 2
    col.active_border = $borderActive
    col.inactive_border = $borderInactive
    layout = dwindle
    resize_on_border = true
    allow_tearing = true
    snap {
        enabled = true
    }
}

group {
    col.border_active = $borderActive
    col.border_inactive = $borderInactive
    col.border_locked_active = $borderActive
    col.border_locked_inactive = $borderInactive
    groupbar {
        font_family = Rubik
        font_size = 10
        gradients = true
        col.active = $groupActive
        col.inactive = $groupInactive
        text_color = $groupText
    }
}

decoration {
    rounding = 10
    active_opacity = 0.90
    inactive_opacity = 0.75
    fullscreen_opacity = 1
    dim_special = 0.3
    shadow {
        enabled = false
    }
    blur {
        enabled = true
        size = 6
        passes = 3
        new_optimizations = true
        ignore_opacity = true
        xray = false
        special = true
    }
}

animations {
    enabled = true
    bezier = smooth, 0.25, 1, 0.5, 1
    bezier = quick, 0.1, 0.9, 0.2, 1
    animation = windowsIn, 1, 4, smooth, popin 92%
    animation = windowsOut, 1, 3, smooth, popin 92%
    animation = windowsMove, 1, 4, smooth, slide
    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 3, smooth
    animation = fadeSwitch, 1, 3, smooth
    animation = fadeDim, 1, 3, smooth
    animation = border, 1, 4, smooth
    animation = borderangle, 0
    animation = workspaces, 1, 3.5, quick, slidefade 20%
    animation = specialWorkspace, 1, 4, smooth, slidevert
    animation = layersIn, 1, 3, smooth, popin 95%
    animation = layersOut, 1, 2, smooth, popin 95%
    animation = fadeLayersIn, 1, 3, smooth
    animation = fadeLayersOut, 1, 2, smooth
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    vrr = 0
    font_family = Rubik
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    anr_missed_pings = 5
    allow_session_lock_restore = true
    render_unfocused_fps = 60
}

xwayland {
    force_zero_scaling = true
}

source = ~/.config/hypr/local.conf
