workspace = special:term, on-created-empty:kitty --class dropdown-term

windowrule = float true, match:class ^(blueman-manager|pavucontrol-qt|vlc|kvantummanager|qt[56]ct|nwg-(look|displays)|org\.kde\.ark|org\.pulseaudio\.pavucontrol|nm-(applet|connection-editor)|btop)$
windowrule = float true, center true, match:title ^(Choose Files|Save As|Confirm to replace files|File Operation Progress|Open|Authentication Required|Add Folder to Workspace|File Upload.*|Library.*|.*dialog.*)$
windowrule = float true, center true, match:initial_title ^(Open File|Volume Control|Save As.*)$
windowrule = float true, center true, match:class ^(.*dialog.*|[Xx]dg-desktop-portal-gtk|org\.freedesktop\.impl\.portal\.desktop\.(hyprland|gtk))$
windowrule = float true, match:class ^(org\.kde\.dolphin)$, match:title ^(Progress Dialog — Dolphin|Copying — Dolphin)$
windowrule = float true, size (monitor_w*0.6) (monitor_h*0.7), center true, opacity 1.0 override 1.0 override, match:class ^(btop)$
windowrule = float true, size (monitor_w*0.55) (monitor_h*0.62), center true, match:class ^(org\.gnome\.Nautilus)$
windowrule = float true, size (monitor_w*0.85) (monitor_h*0.85), center true, opacity 1.0 override 1.0 override, match:class ^(com\.gabm\.satty)$

windowrule {
    name = picture-in-picture
    match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
    float = true
    keep_aspect_ratio = true
    move = (monitor_w*0.73) (monitor_h*0.72)
    size = (monitor_w*0.25) (monitor_h*0.25)
    pin = true
}

windowrule = idle_inhibit fullscreen, match:class ^(.*celluloid.*|.*mpv.*|.*vlc.*|.*[Ss]potify.*)$
windowrule = idle_inhibit fullscreen, match:class ^(.*LibreWolf.*|.*floorp.*|.*brave-browser.*|.*firefox.*|.*chromium.*|.*zen.*|.*vivaldi.*)$

windowrule = opacity 0.90 override 0.90 override 1, match:class ^(brave-browser)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(jetbrains-.*|org\.kde\.dolphin|org\.gnome\.Nautilus)$
windowrule = opacity 0.80 override 0.80 override 1, match:class ^(code-oss|[Cc]ode|code-url-handler|code-insiders-url-handler|org\.kde\.ark|nwg-look|qt5ct|qt6ct|kvantummanager)$
windowrule = opacity 0.80 override 0.70 override 1, match:class ^(org\.pulseaudio\.pavucontrol|blueman-manager|nm-applet|nm-connection-editor|org\.kde\.polkit-kde-authentication-agent-1|polkit-gnome-authentication-agent-1|org\.freedesktop\.impl\.portal\.desktop\.(gtk|hyprland))$
windowrule = opacity 0.70 override 0.70 override 1, match:class ^([Ss]team|steamwebhelper|[Ss]potify)$
windowrule = opacity 0.70 override 0.70 override 1, match:initial_title ^(Spotify Free|Spotify Premium)$
windowrule = opacity 0.80 0.80, match:class ^(com\.github\.tchx84\.Flatseal|hu\.kramo\.Cartridges|com\.obsproject\.Studio|gnome-boxes|WebCord|ArmCord|app\.drey\.Warp|net\.davidotek\.pupgui2|yad|Signal|io\.github\.alainm23\.planify|io\.gitlab\.theevilskeleton\.Upscaler|com\.github\.unrud\.VideoDownloader|io\.gitlab\.adhami3310\.Impression|io\.missioncenter\.MissionCenter|io\.github\.flattool\.Warehouse)$
windowrule = opacity 0.90 0.90, match:class ^(com\.github\.rafostar\.Clapper)$
windowrule = float true, match:class ^(Signal|com\.github\.rafostar\.Clapper|app\.drey\.Warp|net\.davidotek\.pupgui2|yad|eog|io\.github\.alainm23\.planify|io\.gitlab\.theevilskeleton\.Upscaler|com\.github\.unrud\.VideoDownloader|io\.gitlab\.adhami3310\.Impression|io\.missioncenter\.MissionCenter)$

windowrule = workspace special, match:class ^([Ss]potify)$

windowrule = opacity 1.0 override 1.0 override, match:class ^(.*firefox.*|kitty|vesktop|discord)$
windowrule = opacity 1.0 override 1.0 override, match:title ^(.*[Mm]inecraft.*)$
windowrule = opacity 1.0 override 1.0 override, match:class ^(Polinex Fabric|RLCraft)$
windowrule = immediate yes, match:class ^(Polinex Fabric|RLCraft)$
windowrule = immediate yes, opacity 1.0 override 1.0 override, match:class ^(gamescope|cs2|org\.vinegarhq\.Sober|steam_app_.*)$
windowrule = render_unfocused on, match:class ^(Polinex Fabric)$
windowrule = fullscreen 1, match:class ^(RLCraft)$
windowrule = no_initial_focus true, match:class ^(.*jetbrains.*)$, match:title ^(win[0-9]+)$


layerrule = blur true, ignore_alpha 0, match:namespace ^(rofi|notifications|waybar|swayosd|rice-calendar)$
layerrule = no_anim true, match:namespace ^(selection|hyprpicker)$
layerrule = animation slide right, match:namespace ^(notifications)$
